create_chore:
  fields:
    min_age:
      selector:
        number:
          min: 0
          max: 18
          mode: box
    name:
      required: true
      selector:
        text:
    assignees:
      required: true
      example: "Lucas"
      selector:
        text:
          multiple: true
    points:
      default: 1
      selector:
        number:
          min: 0
          max: 100
          mode: box
    recurrence:
      default: none
      selector:
        select:
          translation_key: recurrence
          options: [none, daily, weekly, biweekly]
    due:
      selector:
        datetime:
    rotation:
      default: false
      selector:
        boolean:
    requires_approval:
      default: false
      selector:
        boolean:
    requires_photo:
      default: false
      selector:
        boolean:
delete_chore:
  fields: &chore
    chore_id:
      required: true
      selector:
        text:
claim_chore:
  fields:
    chore_id:
      required: true
      selector:
        text:
    member:
      selector:
        text:
undo_claim:
  fields: *chore
approve_chore:
  fields: *chore
reject_chore:
  fields: *chore
set_absence:
  fields:
    member:
      required: true
      selector:
        text:
    until:
      required: true
      selector:
        datetime:
    start:
      selector:
        datetime:
    substitute:
      selector:
        text:
end_absence:
  fields:
    member:
      required: true
      selector:
        text:
update_chore:
  fields:
    min_age:
      selector:
        number:
          min: 0
          max: 18
          mode: box
    chore_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    assignees:
      selector:
        text:
          multiple: true
    points:
      selector:
        number:
          min: 0
          max: 100
          mode: box
    recurrence:
      selector:
        select:
          translation_key: recurrence
          options: [none, daily, weekly, biweekly]
    due:
      selector:
        datetime:
    rotation:
      selector:
        boolean:
    requires_approval:
      selector:
        boolean:
    requires_photo:
      selector:
        boolean:
set_devices:
  fields:
    member:
      required: true
      selector:
        text:
    devices:
      required: true
      selector:
        entity:
          domain: switch
          multiple: true
grant_pass:
  fields:
    member:
      required: true
      selector:
        text:
    until:
      selector:
        datetime:
revoke_pass:
  fields:
    member:
      required: true
      selector:
        text:
take_over_chore:
  fields:
    chore_id:
      required: true
      selector:
        text:
    member:
      selector:
        text:
announce:
  fields:
    message:
      selector:
        text:
          multiline: true
set_age:
  fields:
    member:
      required: true
      selector:
        text:
    age:
      required: true
      selector:
        number:
          min: 0
          max: 120
          mode: box
create_reward:
  fields:
    name:
      required: true
      selector:
        text:
    cost:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    members:
      selector:
        text:
          multiple: true
update_reward:
  fields:
    reward_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    cost:
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    members:
      selector:
        text:
          multiple: true
delete_reward:
  fields:
    reward_id:
      required: true
      selector:
        text:
redeem_reward:
  fields:
    reward_id:
      required: true
      selector:
        text:
    member:
      selector:
        text:
approve_redemption:
  fields:
    redemption_id:
      required: true
      selector:
        text:
reject_redemption:
  fields:
    redemption_id:
      required: true
      selector:
        text:
