create_chore:
  fields:
    min_age:
      selector:
        number:
          min: 0
          max: 18
          mode: box
    name:
      required: true
      selector:
        text:
    assignees:
      required: true
      example: "Lucas"
      selector:
        text:
          multiple: true
    points:
      default: 1
      selector:
        number:
          min: 0
          max: 100
          mode: box
    recurrence:
      default: none
      selector:
        select:
          translation_key: recurrence
          options: [none, daily, weekly, biweekly, on_demand]
    due:
      selector:
        datetime:
    rotation:
      default: false
      selector:
        boolean:
    requires_approval:
      default: false
      selector:
        boolean:
    requires_photo:
      default: false
      selector:
        boolean:
    steps:
      selector:
        text:
          multiple: true
    weekdays:
      selector:
        select:
          multiple: true
          options:
            - label: Mo
              value: "0"
            - label: Di
              value: "1"
            - label: Mi
              value: "2"
            - label: Do
              value: "3"
            - label: Fr
              value: "4"
            - label: Sa
              value: "5"
            - label: So
              value: "6"
    icon:
      selector:
        text:
    outdoor:
      selector:
        boolean:
    done_entity:
      selector:
        entity:
    done_state:
      selector:
        text:
    start_entity:
      selector:
        entity:
    start_state:
      selector:
        text:
